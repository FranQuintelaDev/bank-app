openapi: 3.0.0
info:
    title: Loan Request API
    version: 1.0.0
    description: API for submitting and managing loan requests.
tags:
  - name: Loans
    description: Operations related to loan requests
paths:
  /loans:
    get:
      tags:
        - Loans
      summary: Retrieve all loan requests with pagination
      operationId: getLoans
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
          description: Page number (zero-based)
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of items per page
        - in: query
          name: sort
          schema:
            type: string
          description: Field to sort by (e.g., id, amount, applicationDate)
        - in: query
          name: direction
          schema:
            type: string
            enum: [ ASC, DESC ]
          description: Sort direction
      responses:
        '200':
          description: A paginated list of loan requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLoanResponse'
    post:
        tags:
          - Loans
        summary: Submit a new loan request
        operationId: createLoan
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanRequestDto'
        responses:
            '201':
                description: Loan request created successfully
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/LoanRequestDto'
  /loans/{id}:
    get:
      tags:
        - Loans
      summary: Retrieve a specific loan request by ID
      operationId: getLoanById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested loan request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanRequestDto'
        '404':
          description: Loan request not found
    patch:
      tags:
        - Loans
      summary: Update a specific loan request by ID
      operationId: updateLoan
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanRequestDto'
      responses:
        '200':
          description: Loan request updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanRequestDto'
        '404':
          description: Loan request not found

components:
    schemas:
        LoanRequestDto:
            type: object
            properties:
                id:
                    type: string
                    description: Unique identifier for the loan request
                applicantName:
                    type: string
                    description: Name of the loan applicant
                amount:
                    type: number
                    format: float
                    description: Amount of loan requested
                    minimum: 0.01
                    maximum: 1000000
                currency:
                    type: string
                    description: Currency of the loan amount (e.g., USD, EUR)
                applicationDate:
                    type: string
                    format: date-time
                    description: Date when the loan application was submitted
                identificationNumber:
                    type: string
                    description: Identification number of the applicant
                status:
                  $ref: '#/components/schemas/LoanStatusDto'
            required:
                - applicantName
                - amount
                - currency
                - applicationDate
                - identificationNumber
        UpdateLoanRequestDto:
          type: object
          properties:
            status:
              $ref: '#/components/schemas/LoanStatusDto'
        LoanStatusDto:
                type: string
                description: Status of the loan request
                enum: [ PENDING, APPROVED, REJECTED, CANCELED ]
        PagedLoanResponse:
                  type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: '#/components/schemas/LoanRequestDto'
                    page:
                      type: integer
                      description: Current page number
                    size:
                      type: integer
                      description: Number of items per page
                    totalElements:
                      type: integer
                      format: int64
                      description: Total number of elements
                    totalPages:
                      type: integer
                      description: Total number of pages
                    first:
                      type: boolean
                      description: Whether this is the first page
                    last:
                      type: boolean
                      description: Whether this is the last page